name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: python -m pip install "lupa>=2.0"
      - name: Tests du moteur
        run: python -m unittest discover -s tests -v
      - name: Analyse du serveur piégé (doit trouver des critiques)
        shell: bash
        run: |
          set +e
          python app.py --cli tests/serveur-piege --lang en --min critical
          code=$?
          test "$code" -eq 2
